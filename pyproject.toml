[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lexical-retrieval-lab"
version = "0.2.0"
description = "Build a BM25 passage index, save and reload a corpus, and evaluate ranked retrieval with reciprocal rank."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["lexrank*"]
